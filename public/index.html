<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Rocco's — Italian Sourdough Pizza</title>
<meta name="description" content="Order Italian sourdough pizza for pickup from Findon Rd or Grange Rd, Adelaide.">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32">
<link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
<link rel="icon" type="image/png" href="/favicon-192.png" sizes="192x192">
<link rel="icon" type="image/png" href="/favicon-512.png" sizes="512x512">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="home">

<header class="bar">
  <a class="logo" href="#home" aria-label="Rocco's Italian Sourdough Pizza"><img src="/images/brand/rocco-live-logo.png" alt="Rocco's — Italian Sourdough Pizza"></a>
  <nav class="bar-nav">
    <a href="#order">Order</a>
    <a href="#book">Book a table</a>
    <button class="cart-btn" id="openCart" type="button">Cart <span id="cartCount">0</span></button>
  </nav>
</header>

<main>
  <section id="view-home" class="view home-view">
    <div class="hero">
      <img class="hero-photo" src="/images/brand/rocco-family-hero.jpg" alt="Rocco stretching dough in the shop, a family photo on the wall behind him">
    </div>
    <div class="home-copy">
      <a class="btn btn-yellow" href="#order">Order</a>
      <a class="btn btn-plain" href="#book">Book a table</a>
    </div>
  </section>

  <section id="view-order" class="view" hidden>
    <div class="sheet">
      <h1>Choose a store</h1>
      <div class="stores" id="storeChoice"></div>
    </div>
  </section>

  <section id="view-menu" class="view" hidden>
    <div class="catbar" id="catbar" role="tablist" aria-label="Menu">
      <button type="button" class="active" data-f="pizza" role="tab">Pizzas</button>
      <button type="button" data-f="extras" role="tab">Extras</button>
      <button type="button" data-f="drinks" role="tab">Drinks</button>
      <button type="button" data-f="dessert" role="tab">Desserts</button>
    </div>
    <p class="cat-note" id="catNote"></p>
    <div class="grid" id="grid"></div>
  </section>

  <section id="view-book" class="view" hidden>
    <div class="sheet">
      <h1>Book a table</h1>
      <p class="lead">Call the shop and we’ll set a table aside.</p>
      <div class="stores" id="bookShops"></div>
    </div>
  </section>
</main>

<footer>
  <p>Findon Rd · 336 Findon Rd<br>Grange Rd · 466 Grange Rd<br><a href="tel:0870784471">7078 4471</a></p>
  <p id="footerNote">Sandbox demo · test cards only</p>
</footer>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Your order">
  <div class="drawer-head">
    <div>
      <h2>Your order</h2>
      <p class="dh-store" id="drawerStore"></p>
    </div>
    <button class="x" id="closeCart" type="button" aria-label="Close">✕</button>
  </div>
  <div class="drawer-body">
    <div id="cartLines"></div>
    <div id="cartFoot" hidden>
      <div class="totals" id="cartTotals">
        <div class="tot-row"><span>Subtotal</span><span id="cartSubtotal">$0</span></div>
        <div class="tot-row discount" id="cartDiscountRow" hidden><span id="cartDiscountLabel">10% off</span><span id="cartDiscount">−$0</span></div>
        <div class="tot-row grand"><span>Total</span><span id="cartTotal">$0</span></div>
        <p class="offer-hint" id="cartHint" hidden></p>
      </div>
      <form class="checkout" id="checkout">
        <p class="step">Pickup</p>
        <input type="hidden" name="where" id="coWhere">
        <div class="store-btns" id="coStores"></div>
        <p class="step">When</p>
        <div class="when">
          <label><input type="radio" name="when" value="asap" checked><span id="asapLbl">Pick up within 30 minutes</span></label>
          <label><input type="radio" name="when" value="time"><span>Pick a time</span></label>
        </div>
        <div class="row" id="coTimeWrap" hidden>
          <label>Day<select name="date" id="coDate"></select></label>
          <label>Time<select name="time" id="coTime"></select></label>
        </div>
        <p class="step">Your details</p>
        <div class="row">
          <input required type="text" name="name" placeholder="Your name" aria-label="Name" autocomplete="name">
          <input required type="tel" name="phone" placeholder="Phone" aria-label="Phone" autocomplete="tel">
        </div>
        <textarea name="notes" rows="2" placeholder="Notes or allergies" aria-label="Notes"></textarea>
        <div id="card-container"></div>
        <p class="pay-note" id="payNote"></p>
        <button class="btn btn-yellow" type="submit" id="payBtn">Pay</button>
        <div class="status" id="coStatus"></div>
      </form>
    </div>
    <div class="confirm" id="confirm"></div>
  </div>
</aside>

<script type="module" src="/app.js"></script>
</body>
</html>
